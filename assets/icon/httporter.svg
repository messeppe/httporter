<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- HTTPorter's app icon. A rounded square (corner radius 22 % of the side) in the theme's
       Theme.app-icon-top to Theme.app-icon-bottom gradient at 160 degrees (CSS: 0 points up,
       clockwise; the end points below are that line for a square), and the white mark of
       ui/icons/porter.svg at 60 % of the side, centred. tools/icon renders it into
       httporter.ico and httporter-32.png; it thickens the stroke for the small sizes. -->
  <defs>
    <linearGradient id="bg" x1="0.281" y1="-0.103" x2="0.719" y2="1.103">
      <stop offset="0" stop-color="#3a8dff"/>
      <stop offset="1" stop-color="#0058c7"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56.32" fill="url(#bg)"/>
  <g transform="translate(51.2 51.2) scale(3.2)" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 30v6a2 2 0 0 0 2 2h24a2 2 0 0 0 2-2v-6"/>
    <path d="M24 30V10M15 18.5L24 9.5l9 9"/>
  </g>
</svg>

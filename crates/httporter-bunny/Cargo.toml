[package]
name = "httporter-bunny"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
futures-util.workspace = true
httporter-core = { version = "0.1.0", path = "../httporter-core" }
reqwest = { workspace = true, features = ["rustls-no-provider", "http2", "stream", "system-proxy"] }
rustls.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "fs", "time"] }
tokio-util = { version = "0.7.20", features = ["io"] }

[dev-dependencies]
dotenvy.workspace = true
hex = "0.4.3"
sha2 = "0.11.1"
tempfile.workspace = true
# test-util: the paused clock; net + io-util: small local servers that count connections.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "net", "io-util"] }
wiremock.workspace = true

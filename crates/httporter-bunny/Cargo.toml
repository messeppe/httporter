[package]
name = "httporter-bunny"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
chrono = "0.4.45"
futures-util = "0.3.34"
httporter-core = { version = "0.1.0", path = "../httporter-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "stream", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["sync", "fs", "time"] }
tokio-util = { version = "0.7.20", features = ["io"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"

[package]
name = "httporter-app"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "httporter"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
chrono.workspace = true
httporter-bunny = { path = "../httporter-bunny" }
httporter-core = { path = "../httporter-core" }
httporter-platform = { path = "../httporter-platform" }
httporter-s3 = { path = "../httporter-s3" }
httporter-transfer = { path = "../httporter-transfer" }
# Not used directly: adds WebP and GIF to the png + jpeg that Slint's own image loading
# decodes (`Image::load_from_path`). resvg already links both decoders.
image = { version = "0.25.10", default-features = false, features = ["webp", "gif"] }
slint ={ workspace = true, features = ["unstable-winit-030"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
i-slint-backend-testing = "1.18"
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }

[package]
name = "httporter-app"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "httporter"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
chrono.workspace = true
httporter-bunny = { path = "../httporter-bunny" }
httporter-core = { path = "../httporter-core" }
httporter-platform = { path = "../httporter-platform" }
httporter-s3 = { path = "../httporter-s3" }
httporter-transfer = { path = "../httporter-transfer" }
slint = { workspace = true, features = ["unstable-winit-030"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
i-slint-backend-testing = "1.18"
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

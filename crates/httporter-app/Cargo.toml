[package]
name = "httporter-app"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "httporter"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
chrono.workspace = true
futures-util.workspace = true
httporter-bunny = { path = "../httporter-bunny" }
httporter-core = { path = "../httporter-core" }
httporter-platform = { path = "../httporter-platform" }
httporter-s3 = { path = "../httporter-s3" }
httporter-transfer = { path = "../httporter-transfer" }
# Not used directly: adds WebP and GIF to the png + jpeg that Slint's own image loading
# decodes (`Image::load_from_path`). resvg already links both decoders.
image = { version = "0.25.10", default-features = false, features = ["webp", "gif"] }
# The update check (system/update.rs): the same features as httporter-bunny, so nothing new links.
reqwest = { workspace = true, features = ["rustls-no-provider", "http2", "stream", "system-proxy"] }
# The update check: ring's TLS crypto for reqwest, and the release feed's JSON. Both are linked
# already (the providers, the store), so nothing new links.
rustls.workspace = true
serde_json.workspace = true
# raw-window-handle-06: the owner window of the file pickers.
slint = { workspace = true, features = ["unstable-winit-030", "raw-window-handle-06"] }
tokio = { workspace = true, features = ["fs", "io-util", "rt-multi-thread", "sync", "time"] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
# The exe's icon, version info and manifest (assets/icon/httporter.rc).
embed-resource = "3"
slint-build.workspace = true

[dev-dependencies]
i-slint-backend-testing.workspace = true
# The text tests compare the renderer's pixels with DirectWrite's own (Windows-only, like the app).
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_DirectWrite", "Win32_Graphics_Gdi"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }

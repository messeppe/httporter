[package]
name = "httporter-core"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
chrono = "0.4.45"
futures-util = "0.3.34"
hex = "0.4.3"
percent-encoding = "2.3.2"
sha2 = "0.11.1"
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "test-util"] }

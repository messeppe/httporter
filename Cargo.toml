[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "1.0.0"
license = "MIT OR Apache-2.0"
publish = false

# Shared dependency versions. Members opt in with `name.workspace = true` and
# add only the features they need (features are additive across members).
[workspace.dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
chrono = "0.4.45"
# Dev only: the live tests read the git-ignored `.env.test` with it.
dotenvy = "0.15.7"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
# Dev only: Slint's headless backend for the window tests.
i-slint-backend-testing = "1.18"
# Exact pin: the credential-store backend must not drift between builds.
keyring = "=3.6.3"
md-5 = "0.11.0"
mime_guess = { version = "2.0.5", default-features = false }
percent-encoding = "2.3.2"
quick-xml = "0.41.0"
reqwest = { version = "0.13.5", default-features = false }
# Native file dialogs. Default features only add the Linux backends.
rfd = { version = "0.17.2", default-features = false }
rusqlite = "0.41.1"
# TLS crypto: ring, not aws-lc-rs (S8: 0.9 MB smaller). reqwest uses `rustls-no-provider`, so
# each HTTP client builder installs ring's provider first.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
# Two renderers on the winit backend: the software one by default (lowest memory, S7),
# and the GPU one (FemtoVG on OpenGL, through glutin) when chosen in Settings › Advanced
# (I5; the app picks one at start in `renderer.rs`). There is no exe-size budget any
# more (user, 2026-11-05).
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "renderer-femtovg",
    "accessibility",
] }
# Build only: compiles the .slint files; same version as `slint`.
slint-build = "1.18"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
url = "2.5.8"
uuid = "1.29.0"
# Microsoft's bindings (taskbar, toasts, registry, clipboard). Members add only the
# features they use.
windows = "0.62.2"
windows-sys = "0.61.2"
wiremock = "0.6.5"

# Never set `panic = "abort"`: the app relies on unwinding.
# Full speed (opt-level 3) for the code that is busy while transferring (checksums, TLS crypto)
# or drawing (the software and GPU renderers and their rasterizers); everything else is built for size
# (opt-level "s"), where full speed would only make the exe bigger (user choice 2026-11-06:
# "busy parts only"). No feature or behaviour is dropped for size.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

[profile.release.package.sha2]
opt-level = 3

[profile.release.package.md-5]
opt-level = 3

[profile.release.package.ring]
opt-level = 3

[profile.release.package.i-slint-renderer-software]
opt-level = 3

[profile.release.package.tiny-skia]
opt-level = 3

[profile.release.package.zeno]
opt-level = 3

[profile.release.package.i-slint-renderer-femtovg]
opt-level = 3

[profile.release.package.femtovg]
opt-level = 3

[profile.release.package.glow]
opt-level = 3

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

# Shared dependency versions. Members opt in with `name.workspace = true` and
# add only the features they need (features are additive across members).
[workspace.dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
chrono = "0.4.45"
# Dev only: the live tests read the git-ignored `.env.test` with it.
dotenvy = "0.15.7"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
# Exact pin: the credential-store backend must not drift between builds.
keyring = "=3.6.3"
md-5 = "0.11.0"
mime_guess = { version = "2.0.5", default-features = false }
percent-encoding = "2.3.2"
quick-xml = "0.41.0"
reqwest = { version = "0.13.5", default-features = false }
# Native file dialogs. Default features only add the Linux backends.
rfd = { version = "0.17.2", default-features = false }
rusqlite = "0.41.1"
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
# The app draws with the software renderer only (main.rs), so the OpenGL renderer
# (femtovg, glutin) and the tray icon stay out of the exe (S8: ≤ 25 MB).
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "accessibility",
] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
url = "2.5.8"
uuid = "1.29.0"
# Microsoft's bindings (taskbar, toasts, registry, clipboard). Members add only the
# features they use.
windows = "0.62.2"
windows-sys = "0.61.2"
wiremock = "0.6.5"

# Never set `panic = "abort"`: the app relies on unwinding.
# Built for size (S8: ≤ 25 MB), except the code that is busy while transferring
# (checksums, TLS) or drawing (the software renderer and its rasterizers).
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

[profile.release.package.sha2]
opt-level = 3

[profile.release.package.md-5]
opt-level = 3

[profile.release.package.aws-lc-sys]
opt-level = 3

[profile.release.package.aws-lc-rs]
opt-level = 3

[profile.release.package.i-slint-renderer-software]
opt-level = 3

[profile.release.package.tiny-skia]
opt-level = 3

[profile.release.package.zeno]
opt-level = 3
